services:
  dynamic-database-access:
    build: .
    container_name: dynamic-database-access
    env_file:
      - /home/mgerrit2/dev-ubuntu/software-projects-ubuntu/.env
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
    networks:
      - app-net
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./src/main/resources/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - app-net
    restart: unless-stopped
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

networks:
  app-net:
    external: true
