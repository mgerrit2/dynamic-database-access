
#######################################################################
# Docker PostgreSQL Connection
#######################################################################
#sql server https://springframework.guru/configuring-spring-boot-for-microsoft-sql-server/
spring.datasource.url=jdbc:postgresql://localhost:5433/gscience-security-dev
spring.datasource.username=${dynamic_database_accesss_pring_datasource_username}
spring.datasource.password=${dynamic_database_accesss_pring_datasource_password}
spring.datasource.driver-class-name=org.postgresql.Driver

#######################################################################
# Hibernate settings
#######################################################################
# JPA / Hibernate settings voor Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# 2. Stop Hibernate from querying database metadata on boot
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

datasourceActive=true

#######################################################################
# hikari settings
#######################################################################
# 1. Prevent HikariCP from failing fast and crashing startup if the database is down
# this is tested and springboot still startup with no database source
spring.datasource.hikari.initialization-fail-timeout=-1

# ==========================================
# HikariCP Connection Pool Configuration
# ==========================================

# Maximum number of actual active and idle connections in the pool (Default: 10)
spring.datasource.hikari.maximum-pool-size=10

# Minimum number of idle connections that HikariCP tries to maintain (Default: same as maximumPoolSize)
spring.datasource.hikari.minimum-idle=10

# Maximum time (in ms) to wait for a connection from the pool before throwing an exception (30 seconds)
spring.datasource.hikari.connection-timeout=30000

# Maximum time (in ms) a connection can sit idle in the pool before being closed (10 minutes)
spring.datasource.hikari.idle-timeout=600000

# Maximum lifetime (in ms) of a connection in the pool regardless of use (30 minutes)
spring.datasource.hikari.max-lifetime=1800000

# Threshold (in ms) to log a warning if a connection is checked out too long (0 = disabled)
spring.datasource.hikari.leak-detection-threshold=0

#######################################################################
# jdbc settings
#######################################################################

# 3. Prevent Spring Batch from trying to initialize its schema on an unreachable DB
spring.batch.jdbc.initialize-schema=never

#######################################################################
# liquibase settings
#######################################################################
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
spring.liquibase.contexts=dev,dev_data
spring.liquibase.label-filter=dev

#######################################################################
# JPA liquibase settings
#######################################################################
spring.jpa.defer-datasource-initialization=false # Keep this
spring.jpa.open-in-view=false


#######################################################################
# Docker ssl settings
#######################################################################
server.ssl.enabled=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# prevent to autoconfigure the datasource
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration


#######################################################################
# actuators
#######################################################################
# Expose health and refresh endpoints over web
management.endpoints.web.exposure.include=health,refresh,info,prometheus

# Explicitly enable the refresh endpoint (if required)
management.endpoint.refresh.enabled=true


#######################################################################
# prometheus
##################################################################
management.endpoint.prometheus.enabled=true