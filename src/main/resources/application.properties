
#######################################################################
# Docker PostgreSQL Connection
#######################################################################
#sql server https://springframework.guru/configuring-spring-boot-for-microsoft-sql-server/
spring.datasource.url=jdbc:postgresql://localhost:5433/gscience-security-dev
spring.datasource.username=${dynamic_database_accesss_pring_datasource_username}
spring.datasource.password=${dynamic_database_accesss_pring_datasource_password}
spring.datasource.driver-class-name=org.postgresql.Driver

#######################################################################
# Hibernate settings
#######################################################################
# JPA / Hibernate settings voor Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# 2. Stop Hibernate from querying database metadata on boot
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

datasourceActive=true

#######################################################################
# hikari settings
#######################################################################
# 1. Prevent HikariCP from failing fast and crashing startup if the database is down
# this is tested and springboot still startup with no database source
spring.datasource.hikari.initialization-fail-timeout=-1

#######################################################################
# jdbc settings
#######################################################################

# 3. Prevent Spring Batch from trying to initialize its schema on an unreachable DB
spring.batch.jdbc.initialize-schema=never

#######################################################################
# liquibase settings
#######################################################################
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
spring.liquibase.contexts=dev,dev_data
spring.liquibase.label-filter=dev

#######################################################################
# JPA liquibase settings
#######################################################################
spring.jpa.defer-datasource-initialization=false # Keep this
spring.jpa.open-in-view=false


#######################################################################
# Docker ssl settings
#######################################################################
server.ssl.enabled=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# prevent to autoconfigure the datasource
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration


#######################################################################
# actuators
#######################################################################
# Expose health and refresh endpoints over web
management.endpoints.web.exposure.include=health,refresh,info

# Explicitly enable the refresh endpoint (if required)
management.endpoint.refresh.enabled=true